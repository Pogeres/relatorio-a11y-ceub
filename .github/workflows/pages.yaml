on:
  push: 
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: latest
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate reports
        env:
          LOGIN: ${{ secrets.LOGIN }}
          PASSWORD: ${{ secrets.PASSWORD }}
        run: npm run start

      - name: Upload
        id: pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: results/

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - name: Deploy
        uses: actions/deploy-pages@v4
        id: pages